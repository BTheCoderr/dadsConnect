name: DadConnect Next 16 current migration

on:
  push:
    branches:
      - upgrade/next16-react19-current
    paths:
      - ".github/workflows/upgrade-next16-current.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/next16-react19-current
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Verify runtime versions
        run: |
          npm ls next react react-dom @supabase/ssr @supabase/supabase-js -w @dadsconnect/web
          npm ls react react-dom -w @dadsconnect/mobile
      - name: Verify mobile types
        run: npm run typecheck:mobile
      - name: Verify shared types
        run: npm run typecheck
      - name: Verify web types
        run: npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Verify lint
        run: npm run -w @dadsconnect/web lint
      - name: Verify production build
        run: npm run build:web
