name: Export source artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: dadsconnect-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
