name: DadConnect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web build + shared typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI only needs non-empty public Supabase config so Next.js can prerender
      # client pages. Production values are configured in Netlify.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck shared package
        run: npm run typecheck
      - name: Typecheck mobile app
        run: npm run typecheck:mobile
      - name: Build web app
        run: npm run build:web
