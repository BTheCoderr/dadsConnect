name: Upgrade Next.js dependency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-next.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Next.js and keep matched React 18 web pair
        run: npm install next@15.5.27 react@18.3.1 react-dom@18.3.1 -w @dadsconnect/web --package-lock-only --save-exact
      - name: Verify clean install
        run: npm ci
      - name: Show web runtime versions
        run: npm ls next react react-dom -w @dadsconnect/web || true
      - name: Verify shared types
        run: npm run typecheck
      - name: Verify mobile types
        run: npm run typecheck:mobile
      - name: Verify web production build
        run: npm run build:web
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          git commit -m "Upgrade Next.js security baseline [skip netlify]"
          git push
