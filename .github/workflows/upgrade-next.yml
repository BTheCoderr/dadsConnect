name: Upgrade Next.js dependency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-next.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Rebuild lockfile from corrected workspace metadata.
      - name: Pin secure Next.js and one React runtime
        run: |
          npm pkg set dependencies.next=15.5.27 dependencies.react=18.2.0 dependencies.react-dom=18.2.0 -w @dadsconnect/web
          npm pkg set overrides.react=18.2.0 overrides.react-dom=18.2.0
          rm package-lock.json
          npm install --package-lock-only
      - name: Verify clean install
        run: npm ci
      - name: Show web runtime versions
        run: npm ls next react react-dom -w @dadsconnect/web
      - name: Verify shared types
        run: npm run typecheck
      - name: Verify mobile types
        run: npm run typecheck:mobile
      - name: Verify web production build
        run: npm run build:web
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json package-lock.json
          git commit -m "Upgrade Next.js security baseline [skip netlify]"
          git push
